server {
    listen 5123;
    server_name localhost;
    
    # 规范化 URL 中的重复斜杠
    if ($request_uri ~ "^//+(.*)") {
        return 301 /$1;
    }
    
    root /app;
    index index.html;

    # 设置 base path 为环境变量，支持 ingress 模式
    set $base_path "";
    if ($http_x_ingress_path) {
        set $base_path $http_x_ingress_path;
    }

    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;
    gzip_disable "MSIE [1-6]\.";

    # CRA 产物文件名自带内容哈希（如 main.7e3195ba.js）——内容变了文件名才会变，
    # 所以可以放心长缓存，避免每次打开面板 / Wallpaper Engine 壁纸都重新下载 6MB+ 的 JS。
    # index.html / service-worker.js 仍走下面的 location /，保持不缓存（否则会指向旧包）。
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $base_path/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        
        # 重写 base path
        sub_filter '<head>' '<head><base href="$base_path/">';
        sub_filter_once on;
    }

 


    # 上传文件
    location /config/hass-panel/upload {
        alias /config/hass-panel/upload;
    }

    # 插件 bundle 静态文件（由后端扫描目录，前端运行时 import）
    # /plugins/<plugin-id>/<entry>  ->  /config/hass-panel/plugins/<plugin-id>/<entry>
    location /plugins {
        alias /config/hass-panel/plugins;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 更新API端点
    location /api {
        proxy_pass http://127.0.0.1:5124;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $base_path;

        # 允许跨域请求
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Api-Key' always;

        # 设置post body
        client_max_body_size 1024M;
        # 处理 OPTIONS 请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Api-Key';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # go2rtc反向代理
    location /go2rtc {
        proxy_pass http://127.0.0.1:5125/go2rtc;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 把 Host 也对齐成 127.0.0.1:5125，和下面的 Origin 改写保持一致。
        # go2rtc 默认只认「Origin host == Host 头」，否则 WebRTC 信令的
        # WebSocket 握手会被拒（websocket: request origin not allowed by Upgrader.CheckOrigin），
        # 画面一直卡在 loading。这里让两者都等于 127.0.0.1:5125，握手必过。
        # （双保险：go2rtc.yaml 里同时设了 api.origin: "*"，任一生效即可。）
        proxy_set_header Host "127.0.0.1:5125";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $base_path;

        # go2rtc 经反代访问时，浏览器 Origin 是面板真实地址；改写为 127.0.0.1:5125
        # 与上面对齐。（go2rtc.yaml 的 api.origin: "*" 已兜底放行，这行主要保证
        # 即便没有 origin:* 配置，Host==Origin 也能通过同源校验。）
        proxy_set_header Origin "http://127.0.0.1:5125";

        # WebSocket支持
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # 允许跨域
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization' always;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 'healthy\n';
    }
} 