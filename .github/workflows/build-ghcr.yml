name: Build Image (GHCR)

# 云端构建镜像并推送到 GitHub Container Registry（ghcr.io），
# 之后在飞牛 NAS 上直接 docker pull 即可，不需要本机装 Docker。
#
# 产物（每次构建都会打这三个标签）：
#   ghcr.io/<owner>/hass-panel:latest                  永远指向最新一次构建
#   ghcr.io/<owner>/hass-panel:v<VERSION>              版本号，取自仓库根目录的 VERSION 文件
#   ghcr.io/<owner>/hass-panel:v<VERSION>-<短sha>      唯一标签，回滚用这个最准
#
# 想发新版本：改仓库根目录的 VERSION 文件（如 1.8.0 → 1.8.1）再推 main 即可。
# 手动触发时也可以临时在 version 输入框里指定，会覆盖 VERSION 文件。

on:
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      version:
        description: '镜像标签（留空则用 latest）'
        required: false
        default: 'latest'
      platforms:
        description: '目标平台（飞牛 NAS 一般是 linux/amd64）'
        required: false
        default: 'linux/amd64'

  # 推送到 main 且改动了源码时自动构建
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'VERSION'
      - '.github/workflows/build-ghcr.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 算出这次要打哪些标签。
      # 版本号优先用手动触发时填的 version，其次读仓库根目录的 VERSION 文件；
      # 再拼一个带短 sha 的唯一标签，这样同一个版本号重复构建也不会互相覆盖、能精确回滚。
      - name: Resolve version tags
        id: ver
        run: |
          set -e
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "latest" ]; then
            VERSION="$INPUT"
          else
            VERSION="$(tr -d ' \r\n' < VERSION)"
          fi
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:v${VERSION}"
            echo "${IMAGE}:v${VERSION}-${SHORT_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "本次标签："
          echo "  ${IMAGE}:latest"
          echo "  ${IMAGE}:v${VERSION}"
          echo "  ${IMAGE}:v${VERSION}-${SHORT_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # Dockerfile 里是 COPY frontend/build /app，所以必须先构建前端
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      # CI=false：CRA 在 CI 环境下会把 warning 当 error，导致构建失败
      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.ver.outputs.tags }}
