name: Build Image (GHCR)

# 云端构建镜像并推送到 GitHub Container Registry（ghcr.io），
# 之后在飞牛 NAS 上直接 docker pull 即可，不需要本机装 Docker。
#
# 产物：ghcr.io/<你的GitHub用户名>/hass-panel:latest
#       ghcr.io/<你的GitHub用户名>/hass-panel:<版本号>

on:
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
    inputs:
      version:
        description: '镜像标签（留空则用 latest）'
        required: false
        default: 'latest'
      platforms:
        description: '目标平台（飞牛 NAS 一般是 linux/amd64）'
        required: false
        default: 'linux/amd64'

  # 推送到 main 且改动了源码时自动构建
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/build-ghcr.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # Dockerfile 里是 COPY frontend/build /app，所以必须先构建前端
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      # CI=false：CRA 在 CI 环境下会把 warning 当 error，导致构建失败
      - name: Build frontend
        working-directory: ./frontend
        env:
          CI: 'false'
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.event.inputs.version || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
