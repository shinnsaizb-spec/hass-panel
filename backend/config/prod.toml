[base]
name = 'Hass Panel'
web_port = 5124
env = "prod"
# ⚠️ notify_token 只是弱占位符：utils/config.py 启动时会换成随机值并落盘到
#    数据目录的 .notify_token（或用环境变量 HASS_PANEL_NOTIFY_TOKEN 覆盖）。
#    升级后旧 webhook 地址会失效，需从面板「通知」设置复制新地址。
notify_token = "hasspanel"
debug = false
user_config_dir = "/config/hass-panel/user_configs"
upload_dir = "/config/hass-panel/upload"
go2rtc_config_path = "/config/hass-panel/go2rtc.yaml"
cache_dir = "/config/hass-panel/cache"

[update_cfg]
github_repo = "mrtian2016/hass-panel"
app_dir = "/app"
version_file = "/app/version.json"
tmp_dir = "/tmp/hass-panel-update"
exclude_path = ["media", "env.js", "env.template.js"]

[log]
server_log = "/config/hass-panel/logs"
log_output_dir = "/config/hass-panel/logs/backend"

[database]
sqlite_path = "/config/hass-panel/hass_panel.db"

[security]
# 跨域白名单：默认空 = 仅同源访问（推荐，面板本来就是同源部署）。
# 确需从其他域名的前端调用本面板 API 时才在这里显式列出，如：
#   cors_allow_origins = ["https://my-dashboard.example.com"]
# ⚠️ 别写 ["*"]：和 allow_credentials 组合等于任意网站都能带凭证调面板 API。
cors_allow_origins = []
# ⚠️ SECRET_KEY 只是占位符：utils/config.py 启动时会把它换成随机值并落盘到
#    数据目录的 .secret_key（或用环境变量 HASS_PANEL_SECRET_KEY 覆盖）。
#    只有「自己改成非占位的长随机串」时才会尊重这里填的值。
SECRET_KEY = "09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7"
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_DAYS = 30
schemes = ["bcrypt"]

